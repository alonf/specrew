schema_version: "1"
depth: light
depth_reason: >-
  Established product and users; this feature is a bounded defect sweep. The maintainer
  confirmed the presented scope at Light depth with the typed reply "move on" on Claude,
  2026-10-13 (workshop receipt 34cc2b6996b11d959255ad05b7fe44bfb1e0dcd783e0233bc9a77a03aff8bb37).
context_scope: feature_standalone
product_id: specrew
product_context_ref: null
areas:
  users_stakeholders: >-
    Specrew developers and the maintainer working through governed sessions.
  pain_job: >-
    Unrelated stops, corrective exchanges, stale work context and refusals without a
    forward action consume developer time. Current workarounds are manual context
    reconciliation, packet and draft corrections and artifact re-reading.
  mvp: >-
    Tier 1 in iteration 1: B4F-104, B4F-106, B4F-100, B4F-102, B4F-105, B4F-089,
    B4F-101, B4F-107, installed-beta4-reproduced B4F-096, and B4F-108 (a transient
    journal-lock failure silently blocks every workshop receipt; cross-host acceptance).
    Tier 2 in iteration 2, only after Tier 1 is accepted: the narrow B4F-054/056/058/061
    ordering slices bounded by B4F-074, B4F-093 and B4F-103.
  constraints: >-
    Branch from 24e5701a, not main; a main merge is a separate later human decision.
    Workshop before the spec; stop at specify for the full packet and verdict; no planning
    or implementation first. Measure before/after extra stops and replies per scenario,
    separating real decisions from corrective exchanges; record elapsed time where
    observable and never treat a missing value as zero. Tier 2 is conditional on human
    acceptance of Tier 1. B4F-103 is a package-comparison correction with no beta4 republish.
  out_of_scope: >-
    All other beta5 items, including both B4F-039 sub-findings, B4F-090, B4F-091 band
    semantics, and any broader review redesign. The historical validator review-evidence,
    defer-provenance and verdict (198/011 needs-rework) failures are excluded and listed in
    the spec as known baseline; new findings in those categories are compared against it.
  success_metrics: >-
    Per-scenario before/after extra-stop and reply counts, real decisions separated from
    corrective exchanges, elapsed time where captured. B4F-108: the same workshop flow
    (product-domain, agenda, one lens) produces receipts and closes each checkpoint with
    the same number of replies on Claude, Codex and Copilot. After values require real runs.
  workshop_receipt: 34cc2b6996b11d959255ad05b7fe44bfb1e0dcd783e0233bc9a77a03aff8bb37
