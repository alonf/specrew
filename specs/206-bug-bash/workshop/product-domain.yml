schema_version: "1"
depth: light
depth_reason: "Narrow defect sweep in a known product: every item was diagnosed before the feature existed, and nothing changes who Specrew is for or how it is used, so alternatives, competition and business-model discovery have nothing to decide."
context_scope: feature_standalone
product_id: null
product_context_ref: null
areas:
  users_and_stakeholders: "The maintainer as release owner; anyone running specrew start without a console (CI, host-launched start, fresh checkout); consumer projects using Copilot; anyone closing an iteration with uncommitted artifacts; feature 203 as receiver of two hand-overs."
  pain_and_workaround: "Nightly red 94 nights without an alert; B5F-036 suites burn a full sweep limit; 35 scripts give no signal; resolver suggests Node/React presets for a PowerShell repository. Workaround today: noticing by accident and reading logs by hand."
  mvp_and_scope: "Items 1, 2a, 2b, 4, 5 and 6a of the bug list, each fix with a failing test first and one bug per commit; nightly green, then silent unless a new failure; one-time triage of history with a closed frozen list."
  non_goals: "Item 3's fix; item 6b's claim identity (B5F-022); feature 204's init/bootstrap scope; any change to the co-review engine or the capture stores; a per-rule validator registry (options A or C)."
  constraints: "No writes to the real home folder (hook files hashed before and after every run); never specrew-update.ps1; feature 203's protected files untouched; .squad/active-features.yml stays uncommitted; CI markdownlint before every push and CI followed after; first push asked for; never main; no pull request without asking."
  rollout: "Branch 206-bug-bash merges to main by a pull request only when the maintainer asks. Success shows as the nightly's first green run on main, then a notification only on a new failure. After the merge, features 203 and 205 take the fixes by merging main, and 203 removes its temporary 60-second known-red limits for the two B5F-036 suites."
  nightly_notification_channel: "Open: options for how the notification reaches a person (for example an issue opened on the first red night and closed on the next green one, versus an email) are brought to the maintainer; none is picked silently."
