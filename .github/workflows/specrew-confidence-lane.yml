name: Specrew Confidence Lane

env:
  SPEC_KIT_VERSION: '0.12.9'
  SQUAD_VERSION: '0.11.0'
  # squad-cli 0.11.0 declares "@bradygaster/squad-sdk": "*", so a plain install takes the newest SDK. squad-sdk 2.0.0
  # (published 2026-11-19) dropped exports the 0.11.0 CLI imports, and the CLI then fails at start. Named in the same
  # `npm install -g` as the CLI, this is the SDK the CLI resolves. Remove this pin when Specrew moves to a squad
  # release whose CLI and SDK agree.
  SQUAD_SDK_VERSION: '1.1.0'

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  confidence-lane:
    name: Confidence lane
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install specify CLI
        run: uv tool install --force specify-cli --from "git+https://github.com/github/spec-kit.git@v${SPEC_KIT_VERSION}"

      - name: Install squad CLI
        # The SDK is named in the same command as the CLI: only then does npm resolve the CLI's "*" to it. A later
        # install of the CLI alone nests the newest SDK again (see SQUAD_SDK_VERSION above).
        run: npm install -g "@bradygaster/squad-cli@${SQUAD_VERSION}" "@bradygaster/squad-sdk@${SQUAD_SDK_VERSION}"

      - name: Check squad CLI health
        # One clear red at install time when an upstream release breaks the installed CLI, not failures in suites
        # further down. Checks the CLI starts, reports SQUAD_VERSION, and resolves SQUAD_SDK_VERSION.
        shell: bash
        run: |
          root="$(npm root -g)"
          pkg="$root/@bradygaster/squad-cli/node_modules/@bradygaster/squad-sdk/package.json"
          [ -f "$pkg" ] || pkg="$root/@bradygaster/squad-sdk/package.json"
          sdk="$(node -p 'require(process.argv[1]).version' "$pkg" 2>&1)" || sdk="unreadable: $sdk"
          if ! out="$(squad --version 2>&1)" || ! grep -Fqx "$SQUAD_VERSION" <<<"$out" || [ "$sdk" != "$SQUAD_SDK_VERSION" ]; then
            echo "::error title=squad CLI is not healthy::expected squad-cli $SQUAD_VERSION with squad-sdk $SQUAD_SDK_VERSION; the CLI resolves squad-sdk $sdk; squad --version printed the lines below"
            printf '%s\n' "$out"
            exit 1
          fi
          echo "squad CLI healthy: squad-cli $SQUAD_VERSION, squad-sdk $sdk"

      - name: Run confidence lane smoke harness
        shell: pwsh
        run: ./tests/manual/copilot-squad-confidence-lane.ps1 -LaunchCopilot -TraceDirectory ./.scratch/copilot-squad-confidence-lane/traces -LaneName confidence -MissingToolExitMode skip

      - name: Upload confidence lane traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: specrew-confidence-lane-traces
          path: ./.scratch/copilot-squad-confidence-lane/traces
