name: Specrew Nightly Truth-Check

# Full-repo governance validation truth-check.
#
# Purpose: routine pushes and PRs validate only changed iterations (per
# Proposal 087 + ci(lint-scoping)). This scheduled workflow exists as
# the safety net that catches drift in closed iterations — e.g., if a
# new validator rule was added that should apply retroactively, or if
# closed-iteration artifacts were accidentally modified.
#
# Cadence: daily at 06:00 UTC. Wall-clock doesn't matter for an
# overnight audit; what matters is that any drift surfaces within ~24
# hours of landing.
#
# Manual trigger: workflow_dispatch is enabled for ad-hoc audits
# (e.g., after shipping a schema-migration commit that adds a new
# validator rule, or for pre-release sanity checks before tagging).
#
# Notification (FR-009): the validator writes its findings (iteration ids,
# rule names, severities) to a file; the notify job reads it and keeps one
# tracking issue labelled nightly-truth-check: opened on the first red night,
# commented on only when the failure set changes, closed on the next green
# night. Only the notify job holds issues: write; the default stays read-only.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-repo-validator:
    name: Full-repo governance validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate full repo
        shell: pwsh
        run: ./extensions/specrew-speckit/scripts/validate-governance.ps1 -ProjectPath . -FindingsJsonPath "$env:RUNNER_TEMP/nightly-findings.json"

      - name: Upload the findings file
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-findings
          path: ${{ runner.temp }}/nightly-findings.json
          if-no-files-found: ignore
          retention-days: 14

  notify:
    name: Tracking issue
    needs: full-repo-validator
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download the findings file
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: nightly-findings
          path: ${{ runner.temp }}/findings

      - name: Open, comment on or close the tracking issue
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VALIDATOR_OUTCOME: ${{ needs.full-repo-validator.result }}
        run: >-
          ./.github/scripts/nightly-tracking-issue.ps1
          -ValidatorOutcome $env:VALIDATOR_OUTCOME
          -FindingsJsonPath "$env:RUNNER_TEMP/findings/nightly-findings.json"
          -RunId $env:GITHUB_RUN_ID
          -Commit $env:GITHUB_SHA
