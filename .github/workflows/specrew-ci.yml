name: Specrew CI

env:
  SPEC_KIT_VERSION: '0.12.9'
  SQUAD_VERSION: '0.11.0'
  # squad-cli 0.11.0 declares "@bradygaster/squad-sdk": "*", so a plain install takes the newest SDK. squad-sdk 2.0.0
  # (published 2026-11-19) dropped exports the 0.11.0 CLI imports, and the CLI then fails at start. Named in the same
  # `npm install -g` as the CLI, this is the SDK the CLI resolves. Remove this pin when Specrew moves to a squad
  # release whose CLI and SDK agree.
  SQUAD_SDK_VERSION: '1.1.0'

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, 001-specrew-product ]
  # Feature 206 T027 (bug list item 12): re-check a commit without a new push, as Test and Cross-Platform
  # Validation allow. A manual run takes the push path; with no push base, the governance step scopes to its
  # fallback base (origin/main), a wider check.
  workflow_dispatch:

jobs:
  self-leak-lint:
    name: Self-leak firewall (deploy surface)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Lint the consumer-deployed surface against the deny-list
        shell: pwsh
        # Blocking in the self-host repo (F-198 FR-033): a deny-listed
        # Specrew-self fact without a specrew-self-ok annotation is a red
        # build. Exit 2 (unreadable rule surface) also fails loud.
        run: pwsh -NoProfile -File scripts/internal/lint-self-leak.ps1 -ProjectRoot .

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Lint Markdown files
        if: github.event_name != 'pull_request'
        run: markdownlint '**/*.md' --ignore node_modules --ignore .squad --ignore .specify

      - name: Lint changed Markdown files
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="origin/${{ github.event.pull_request.base.ref }}"
          if ! git rev-parse --verify "$base" >/dev/null 2>&1; then
            echo "Base ref $base unavailable; falling back to full Markdown lint."
            markdownlint '**/*.md' --ignore node_modules --ignore .squad --ignore .specify
            exit 0
          fi

          mapfile -t files < <(git diff --name-only --diff-filter=d "$base"...HEAD -- '*.md' | grep -vE '^(node_modules/|\.squad/|\.specify/)' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No changed Markdown files to lint'
            exit 0
          fi

          markdownlint "${files[@]}"

      - name: Setup PowerShell
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Lint PowerShell scripts
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          # PSScriptAnalyzer with PSGallery settings reports many style warnings
          # (PSUseSingularNouns, PSUseApprovedVerbs, etc.) on pre-existing scripts.
          # These predate F-023 and are tracked under Proposal 037 for systematic
          # cleanup. Filter to Severity = Error so only real defects block CI;
          # warnings still print for awareness but don't fail the build.
          $scriptFiles = Get-ChildItem -Path . -Filter *.ps1 -Recurse -File |
                         Where-Object { $_.FullName -notmatch '[\\/]\.(git|squad|specify)[\\/]' }
          if ($scriptFiles.Count -gt 0) {
            $allResults = $scriptFiles | ForEach-Object {
              Invoke-ScriptAnalyzer -Path $_.FullName -Settings PSGallery
            }
            $errors = @($allResults | Where-Object { $_.Severity -eq 'Error' })
            $warnings = @($allResults | Where-Object { $_.Severity -eq 'Warning' })
            if ($warnings.Count -gt 0) {
              Write-Host "::group::PSScriptAnalyzer warnings (Proposal 037 cleanup queue, non-blocking)"
              $warnings | Format-Table -AutoSize
              Write-Host "::endgroup::"
              Write-Host ("Warnings: {0} (not blocking)" -f $warnings.Count)
            }
            if ($errors.Count -gt 0) {
              Write-Host "PSScriptAnalyzer errors (blocking):"
              $errors | Format-Table -AutoSize
              exit 1
            }
            Write-Host ("PASS: no PSScriptAnalyzer errors. Warnings count: {0}" -f $warnings.Count)
          }
          else {
            Write-Host 'No PowerShell scripts found to lint'
          }

      - name: Lint changed PowerShell scripts
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          # PSScriptAnalyzer with PSGallery settings reports many style warnings
          # (PSUseSingularNouns, PSUseApprovedVerbs, etc.) on pre-existing scripts.
          # These predate F-023 and are tracked under Proposal 037 for systematic
          # cleanup. Filter to Severity = Error so only real defects block CI;
          # warnings still print for awareness but don't fail the build.
          $baseRef = "origin/${{ github.event.pull_request.base.ref }}"
          $null = & git rev-parse --verify $baseRef 2>$null
          if ($LASTEXITCODE -eq 0) {
            $scriptFiles = @(
              & git diff --name-only --diff-filter=d "$baseRef...HEAD" -- '*.ps1' 2>$null |
                ForEach-Object { [string]$_ } |
                Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
                Where-Object { $_ -notmatch '^(?:\.git|\.squad|\.specify)(?:/|$)' }
            )
            if ($scriptFiles.Count -eq 0) {
              Write-Host 'No changed PowerShell scripts found to lint'
              exit 0
            }
          }
          else {
            Write-Host "Base ref $baseRef unavailable; falling back to full PowerShell lint"
            $scriptFiles = Get-ChildItem -Path . -Filter *.ps1 -Recurse -File |
                           Where-Object { $_.FullName -notmatch '[\\/]\.(git|squad|specify)[\\/]' } |
                           Select-Object -ExpandProperty FullName
          }

          $allResults = $scriptFiles | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_ -Settings PSGallery
          }
          $errors = @($allResults | Where-Object { $_.Severity -eq 'Error' })
          $warnings = @($allResults | Where-Object { $_.Severity -eq 'Warning' })
          if ($warnings.Count -gt 0) {
            Write-Host "::group::PSScriptAnalyzer warnings (Proposal 037 cleanup queue, non-blocking)"
            $warnings | Format-Table -AutoSize
            Write-Host "::endgroup::"
            Write-Host ("Warnings: {0} (not blocking)" -f $warnings.Count)
          }
          if ($errors.Count -gt 0) {
            Write-Host "PSScriptAnalyzer errors (blocking):"
            $errors | Format-Table -AutoSize
            exit 1
          }
          Write-Host ("PASS: no PSScriptAnalyzer errors. Warnings count: {0}" -f $warnings.Count)

      - name: Validate iteration governance (PR)
        if: github.event_name == 'pull_request'
        timeout-minutes: 25
        shell: pwsh
        run: ./extensions/specrew-speckit/scripts/validate-governance.ps1 -ProjectPath . -ChangedOnly

      - name: Show the push base the governance step will scope to
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          SPECREW_SCOPE_BASE_REF: ${{ github.event.before }}
        run: |
          # B4F-079: GitHub refuses to let a workflow overwrite GITHUB_BASE_REF, so the push base travels in a
          # Specrew-owned variable. This step prints what the validator will scope to, for the record.
          Write-Host ("SPECREW_SCOPE_BASE_REF: {0}" -f $env:SPECREW_SCOPE_BASE_REF)
          . ./extensions/specrew-speckit/scripts/shared-governance.ps1
          Write-Host ("scope base resolves to: [{0}]" -f (Get-SpecrewLocalScopeBaseRef -ProjectRoot .))

      - name: Validate iteration governance (push)
        if: github.event_name != 'pull_request'
        timeout-minutes: 25
        shell: pwsh
        env:
          # B4F-079: `GITHUB_BASE_REF: ${{ github.event.before }}` was inert here (GitHub owns GITHUB_*), so
          # every push validation scoped to origin/main. The Specrew-owned name carries the base.
          SPECREW_SCOPE_BASE_REF: ${{ github.event.before }}
          SPECREW_VALIDATOR_VERBOSE: '1'
        run: ./extensions/specrew-speckit/scripts/validate-governance.ps1 -ProjectPath . -ChangedOnly

      - name: Integration - legacy state readers
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/integration/Test-LegacyStateReaders.Tests.ps1

  deterministic-gate:
    name: Deterministic gate
    runs-on: ubuntu-latest
    needs: lint
    # The explicit F-198 registry alone measured 19.22 minutes on the beta3 release tree.
    # This job also installs three toolchains and runs the remaining deterministic integration gates.
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # The honesty registry below runs generator-markdown-parity, which refuses to fake a pass:
      # with markdownlint absent it exits 2 as INCONCLUSIVE rather than green. `needs: lint`
      # ORDERS the jobs but does not share the lint runner's tools, so this lane reported
      # INCONCLUSIVE on every run (the standing main red carried as a chore from the beta2
      # closeout). Installing the tool here is what lets the lane report a real result.
      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install specify CLI
        run: uv tool install --force specify-cli --from "git+https://github.com/github/spec-kit.git@v${SPEC_KIT_VERSION}"

      - name: Install squad CLI
        # The SDK is named in the same command as the CLI: only then does npm resolve the CLI's "*" to it. A later
        # install of the CLI alone nests the newest SDK again (see SQUAD_SDK_VERSION above).
        run: npm install -g "@bradygaster/squad-cli@${SQUAD_VERSION}" "@bradygaster/squad-sdk@${SQUAD_SDK_VERSION}"

      - name: Check squad CLI health
        # One clear red at install time when an upstream release breaks the installed CLI, not failures in suites
        # further down. Checks the CLI starts, reports SQUAD_VERSION, and resolves SQUAD_SDK_VERSION.
        shell: bash
        run: |
          root="$(npm root -g)"
          pkg="$root/@bradygaster/squad-cli/node_modules/@bradygaster/squad-sdk/package.json"
          [ -f "$pkg" ] || pkg="$root/@bradygaster/squad-sdk/package.json"
          sdk="$(node -p 'require(process.argv[1]).version' "$pkg" 2>&1)" || sdk="unreadable: $sdk"
          if ! out="$(squad --version 2>&1)" || ! grep -Fqx "$SQUAD_VERSION" <<<"$out" || [ "$sdk" != "$SQUAD_SDK_VERSION" ]; then
            echo "::error title=squad CLI is not healthy::expected squad-cli $SQUAD_VERSION with squad-sdk $SQUAD_SDK_VERSION; the CLI resolves squad-sdk $sdk; squad --version printed the lines below"
            printf '%s\n' "$out"
            exit 1
          fi
          echo "squad CLI healthy: squad-cli $SQUAD_VERSION, squad-sdk $sdk"

      - name: F-198 honesty regression suite (NFR-007)
        # The 0.40.0-beta2 hardening honesty bar - an EXPLICIT, bounded registry (never a glob) of
        # the ratchet / spend-allowance / containment / tracker-honesty / co-review regressions, each
        # run with a per-test timeout and clear failure output. These paired tests must not merge as
        # manual-only; this lane is their CI enforcement.
        shell: pwsh
        timeout-minutes: 30
        run: pwsh -NoProfile -File ./tests/f198-regression-suite.ps1

      # Feature 205 (FR-021): the lens-order parity test plus every existing workshop test that covers a file 205
      # touches and is not already in the F-198 registry above (workshop-agenda-confirmation, lens-conduct-delivery,
      # specify-workshop-routing and seven more already run there).
      - name: Workshop lens order - parity (index.yml is the one order; FR-001/FR-005)
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/unit/lens-order-parity.tests.ps1

      - name: Workshop lens order - agent-led workshop replay
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/integration/agent-led-workshop-replay.tests.ps1

      - name: Workshop lens order - agenda vocabulary (skill copies + agenda writer)
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/integration/workshop-agenda-vocabulary.tests.ps1

      - name: Workshop lens order - intake completion survives the agenda
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/integration/workshop-intake-completion-survives-agenda.tests.ps1

      - name: Workshop lens order - material packet language
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/integration/workshop-material-packet-language.tests.ps1

      - name: Workshop lens order - code-implementation lens
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/unit/code-implementation-lens.tests.ps1

      - name: Workshop lens order - applicability selector (always-on order)
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/unit/lens-applicability-selector.tests.ps1

      - name: Workshop lens order - product-domain lens
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/unit/product-domain-lens.tests.ps1

      - name: Workshop lens order - workshop delegation
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/unit/workshop-delegation.tests.ps1

      - name: Workshop lens order - workshop question tool
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/unit/workshop-question-tool.tests.ps1

      # Feature 205 iteration 002 (FR-028, FR-029): the workshop length budget and the question consumers.
      - name: Workshop length budget and question consumers (FR-028/FR-029)
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/unit/workshop-length-budget.tests.ps1

      # Feature 205 iteration 003 (FR-030, SC-011): the code lens's dated per-stack lines and their stale marker.
      - name: Code lens freshness (FR-030/SC-011)
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/unit/code-lens-freshness.tests.ps1

      # Feature 205 iteration 003 (FR-032): the agenda grouped by space, written as UTF-8.
      - name: Workshop agenda grouping (FR-032)
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/unit/workshop-agenda-grouping.tests.ps1

      - name: Tier-2 production harness contract dry run (zero provider spend)
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/manual/review-production-harness-dry-run.ps1

      - name: Integration - bootstrap to iteration
        shell: pwsh
        run: ./tests/integration/bootstrap-to-iteration.ps1

      - name: Integration - brownfield conflict handling
        shell: pwsh
        run: ./tests/integration/brownfield-conflict-handling.ps1

      - name: Integration - deploy extension missing-source tolerance
        shell: pwsh
        run: ./tests/integration/deploy-extension-missing-source-tolerance.tests.ps1

      - name: Integration - FileList completeness (bidirectional)
        shell: pwsh
        run: ./tests/integration/filelist-completeness.tests.ps1

      - name: Integration - bootstrap resolver guard (F-174 P1)
        shell: pwsh
        run: ./tests/integration/bootstrap-resolver-guard.tests.ps1

      - name: Bootstrap suite (F-174 hook chain - incl. directive delivery cap, P2)
        shell: pwsh
        # The whole tests/bootstrap/*.Tests.ps1 suite was previously validated only manually at review time
        # (Prop-145 REG-1). Gate it in CI so the F-174 hook-chain guards - notably DirectiveDeliveryCap (the P2
        # 10K-cap fit) and HostDeliveryPolicy (the per-host pointer/inline policy) - cannot silently regress.
        run: |
          $failed = @()
          Get-ChildItem -Path ./tests/bootstrap -Filter *.Tests.ps1 -File | Sort-Object Name | ForEach-Object {
            & pwsh -NoProfile -File $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $_.Name }
          }
          if ($failed.Count -gt 0) { Write-Host "FAILED bootstrap suites: $($failed -join ', ')"; exit 1 }
          Write-Host "Bootstrap suite: all green"

      - name: Integration - drift scenario
        shell: pwsh
        run: ./tests/integration/drift-scenario.ps1

      - name: Integration - iteration resume
        shell: pwsh
        run: ./tests/integration/iteration-resume.ps1

      - name: Integration - task progress tracking
        shell: pwsh
        run: ./tests/integration/task-progress-tracking.tests.ps1

      - name: Integration - iteration state truth
        shell: pwsh
        run: ./tests/integration/iteration-state-truth.tests.ps1

      - name: Integration - planning effort model
        shell: pwsh
        run: ./tests/integration/planning-effort-model.ps1

      - name: Integration - planning overcommit
        shell: pwsh
        run: ./tests/integration/planning-overcommit.ps1

      - name: Integration - process quality report
        shell: pwsh
        run: ./tests/integration/process-quality-report.ps1

      - name: Integration - process quality scorer
        shell: pwsh
        run: ./tests/integration/process-quality-scorer.ps1

      - name: Integration - version info states + prerelease-label parse (Proposal 079 + finding #2)
        shell: pwsh
        run: ./tests/integration/version-info-states.tests.ps1

      - name: Integration - boundary-sync markdownlint gate (.squad exclusion regression guard)
        shell: pwsh
        run: ./tests/integration/boundary-sync-markdownlint-gate.tests.ps1

      - name: Integration - version mismatch warning (start, non-blocking + actionable)
        shell: pwsh
        run: ./tests/integration/version-checks.tests.ps1

      - name: Integration - module-path announce origin (dev-trial vs module-announce)
        shell: pwsh
        run: ./tests/integration/module-path-announce-origin.tests.ps1

      - name: Integration - Unix resolver path semantics (F-160 / Proposal 160; POSIX branch runs on this Ubuntu lane)
        shell: pwsh
        run: ./tests/integration/unix-resolver-path-semantics.tests.ps1

      - name: Integration - managed runtime sidecar marker provenance (F-160 / Proposal 161)
        shell: pwsh
        run: ./tests/integration/managed-runtime-sidecar.tests.ps1

      - name: Integration - managed-skill stuck-preserving deploy-level guard (F-161)
        shell: pwsh
        run: ./tests/integration/managed-skill-stuck-preserving.tests.ps1

      - name: Integration - gate-stop skill contract (F-165; disallowed-tools + six-section packet + Claude routing + .specify mirror parity)
        shell: pwsh
        run: ./tests/integration/gate-stop-skill.tests.ps1

      - name: Integration - GitHub Actions Node runtime pins
        shell: pwsh
        run: ./tests/integration/github-actions-node-runtime-pins.tests.ps1

      - name: Unit - Squad install names the paired SDK (init, update, printed repair)
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/unit/squad-install-pair.tests.ps1

      - name: Integration - script suites no lane ran before the test census (F-206 T015)
        shell: pwsh
        timeout-minutes: 20
        # Feature 206 (FR-011, FR-012): these script-style suites ran in no lane, CI step or release manifest
        # until the test census counted them. Each was read for writes to the real home folder and run alone with
        # the home hook files hashed before it was listed here (maintainer ruling 2026-11-12). The slow ones are
        # in .specrew/release-gate-suites.txt instead. Each runs in its own process; every one runs, and the step
        # fails if any exits non-zero.
        run: |
          $suites = @(
            'tests/integration/brownfield-merge.ps1'
            'tests/integration/carry-forward-closed-iteration.ps1'
            'tests/integration/concurrency-sizing.ps1'
            'tests/integration/descriptive-reference-authored-prose.ps1'
            'tests/integration/descriptive-reference-excluded-surfaces.ps1'
            'tests/integration/feature-018-render-budget.ps1'
            'tests/integration/gap-governance.ps1'
            'tests/integration/hardening-gate-contract.ps1'
            'tests/integration/lockout-chain-cap.ps1'
            'tests/integration/mechanical-findings-contract.ps1'
            # F-206 T024 (SC-001, maintainer 2026-11-16): its fixture is a temp folder with its own git repository.
            'tests/integration/project-path-resolution-regression.ps1'
            'tests/integration/quality-evidence-governance.ps1'
            'tests/integration/quality-profile-foundation.ps1'
            'tests/integration/reviewer-artifacts.ps1'
            'tests/integration/reviewer-closeout-governance.ps1'
            'tests/integration/reviewer-regression-event.ps1'
            'tests/integration/reviewer-regression-ledger.ps1'
            'tests/integration/reviewer-regression-withdrawal.ps1'
            'tests/integration/specrew-start-auto-continue-preservation.ps1'
            'tests/integration/specrew-start-baseline-tracking.ps1'
            'tests/integration/specrew-start-change-detector.ps1'
            'tests/integration/specrew-start-end-to-end.ps1'
            'tests/integration/specrew-start-parameter-handling.ps1'
            'tests/integration/specrew-start-pause-and-confirm.ps1'
          )
          $failed = @()
          foreach ($suite in $suites) {
            $watch = [Diagnostics.Stopwatch]::StartNew()
            & pwsh -NoProfile -NonInteractive -File "./$suite"
            $code = $LASTEXITCODE
            Write-Host ("RESULT {0}: exit {1} in {2:N0} s" -f $suite, $code, $watch.Elapsed.TotalSeconds)
            if ($code -ne 0) { $failed += $suite }
          }
          # Pester suites whose Unix evidence comes from this runner (F-206 T002, maintainer 2026-11-13).
          $pesterSuites = @(
            'tests/unit/overclaim-dirty-check-separator.tests.ps1'
          )
          foreach ($suite in $pesterSuites) {
            $watch = [Diagnostics.Stopwatch]::StartNew()
            $result = Invoke-Pester -Path "./$suite" -PassThru -Output Detailed
            Write-Host ("RESULT {0}: {1} passed, {2} failed in {3:N0} s" -f $suite, $result.PassedCount, $result.FailedCount, $watch.Elapsed.TotalSeconds)
            if ($result.FailedCount -gt 0 -or $result.Result -ne 'Passed') { $failed += $suite }
          }
          if ($failed.Count -gt 0) { Write-Host ("FAILED ({0}): {1}" -f $failed.Count, ($failed -join ', ')); exit 1 }
          Write-Host ("All {0} script suites and {1} Pester suites green" -f $suites.Count, $pesterSuites.Count)

  publish-suite-windows:
    name: Publish suite (windows-latest)
    # Feature 206 T028 (maintainer 2026-11-16 14:38, "206 publish: A"): the publish suite runs on every push, on the OS
    # the real publish job uses (publish-module.yml, windows-latest). On Linux, PowerShellGet's Publish-Module -WhatIf
    # copies the module without its hidden .gitkeep files and rejects the FileList (bug list item 56).
    # This job must never map PSGALLERY_API_KEY, or any secret: the suite's no-key case relies on the key being absent.
    # It needs no other job and is not continue-on-error, so a red publish suite turns Specrew CI red.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Integration - distribution module publish suite (F-206 T028)
        shell: pwsh
        timeout-minutes: 8
        run: pwsh -NoProfile -NonInteractive -File ./tests/integration/distribution-module-publish.ps1

  windows-shim-suites:
    name: Windows .cmd-shim suites (windows-latest)
    # Feature 206, iteration 002 review round 2, finding 2 (maintainer 2026-11-16 20:56, "OK for both"): these two suites
    # drive specrew-init and the specrew CLI through .cmd shims, which only Windows runs. They sat in the ubuntu-latest
    # deterministic gate under if: runner.os != 'Linux', so they never ran (bootstrap-asset-blocker-recovery since
    # 2026-05-20). They run here on every push. The local review lanes do not run them: bootstrap-asset-blocker-recovery
    # runs specrew-init, which writes the real home's hook files on a developer machine, and the runner's home is
    # disposable. This job maps no secret, needs no other job and is not continue-on-error.
    # Its first run (2026-11-16, job 133612182338) stopped in specrew-init's dependency check, "Node.js v22.23.4
    # (required: 24.0+)" (scripts/init/preflight.ps1): it now sets up Node 24 as the other jobs do. The suites shim
    # specify, uv and squad; git and PowerShell 7 come with the runner. The second suite runs even when the first fails
    # (if: always()), so each gives its own result; a failed step still turns the job red.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Integration - bootstrap asset blocker recovery
        shell: pwsh
        timeout-minutes: 6
        run: pwsh -NoProfile -NonInteractive -File ./tests/integration/bootstrap-asset-blocker-recovery.ps1

      - name: Integration - validate versions cli behavior
        if: always()
        shell: pwsh
        timeout-minutes: 6
        run: pwsh -NoProfile -NonInteractive -File ./tests/integration/validate-versions-cli-behavior.ps1

  contract-lane:
    name: Contract lane
    runs-on: ubuntu-latest
    needs: deterministic-gate
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install specify CLI
        run: uv tool install --force specify-cli --from "git+https://github.com/github/spec-kit.git@v${SPEC_KIT_VERSION}"

      - name: Install squad CLI
        # The SDK is named in the same command as the CLI: only then does npm resolve the CLI's "*" to it. A later
        # install of the CLI alone nests the newest SDK again (see SQUAD_SDK_VERSION above).
        run: npm install -g "@bradygaster/squad-cli@${SQUAD_VERSION}" "@bradygaster/squad-sdk@${SQUAD_SDK_VERSION}"

      - name: Check squad CLI health
        # One clear red at install time when an upstream release breaks the installed CLI, not failures in suites
        # further down. Checks the CLI starts, reports SQUAD_VERSION, and resolves SQUAD_SDK_VERSION.
        shell: bash
        run: |
          root="$(npm root -g)"
          pkg="$root/@bradygaster/squad-cli/node_modules/@bradygaster/squad-sdk/package.json"
          [ -f "$pkg" ] || pkg="$root/@bradygaster/squad-sdk/package.json"
          sdk="$(node -p 'require(process.argv[1]).version' "$pkg" 2>&1)" || sdk="unreadable: $sdk"
          if ! out="$(squad --version 2>&1)" || ! grep -Fqx "$SQUAD_VERSION" <<<"$out" || [ "$sdk" != "$SQUAD_SDK_VERSION" ]; then
            echo "::error title=squad CLI is not healthy::expected squad-cli $SQUAD_VERSION with squad-sdk $SQUAD_SDK_VERSION; the CLI resolves squad-sdk $sdk; squad --version printed the lines below"
            printf '%s\n' "$out"
            exit 1
          fi
          echo "squad CLI healthy: squad-cli $SQUAD_VERSION, squad-sdk $sdk"

      - name: Validation contract lane
        shell: pwsh
        run: ./tests/integration/validation-contract-lane.ps1

      - name: Start-command non-interactive first-run regression
        shell: pwsh
        run: ./tests/integration/start-command-non-interactive-first-run.tests.ps1
